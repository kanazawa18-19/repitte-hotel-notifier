name: Monitor job_sales

on:
  # ★ 起動係は GAS の時限トリガー（30分おきに workflow_dispatch を叩く）。
  #   実体は cnctor-onboarding の gas/dispatch-trigger.gs にある（1本で両リポジトリを叩く）。
  #   GitHub の schedule: は混雑時に間引かれ、'*/5' と書いても実測は
  #   24回中24回が60分超・中央値433分・最大2925分（＝2日）だった。
  #   消さずに4時間おきの保険として残す。GAS が止まったときに無音で全停止しないため。
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# ★ 同時に2つ走らせない。stateを読んでから書くまでの間に別のrunが割り込むと、
#   両方が同じ起点から同じメッセージを取得し、#repitte-hotel へ二重に転記する。
#   cancel-in-progress: false は「走っている方を殺さず、後から来た方を待たせる」。
#   途中で殺すと、転記だけ済んでstateが進んでいない状態で止まりうる。
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pytest

      - name: Run tests
        run: pytest tests/ -q

      - name: Run monitor
        run: python monitor.py
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          JOB_SALES_CHANNEL_ID: ${{ secrets.JOB_SALES_CHANNEL_ID }}
          REPITTE_HOTEL_CHANNEL_ID: ${{ secrets.REPITTE_HOTEL_CHANNEL_ID }}
          HIRAMOTO_USER_ID: ${{ secrets.HIRAMOTO_USER_ID }}
          TAKESUE_USER_ID: ${{ secrets.TAKESUE_USER_ID }}
          REPITTE_TEAM_GROUP_ID: ${{ secrets.REPITTE_TEAM_GROUP_ID }}

      # ★ if: always() を付ける。監視本体が途中で落ちても、確定した起点だけは残す。
      #   起点が残らないと、次の回でまた引き直され、その間の投稿を落とす。
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_processed.txt
          # ★ 「stateを直した」お知らせの未送分も一緒に保存する。
          #   ここで保存しないと、伝えられなかったお知らせが次の実行に残らず、
          #   壊れていた間の取りこぼしを人に知らせる機会が永久に失われる。
          #   伝わって消えたときは削除がステージされる。まだ一度も出たことが
          #   なければ追跡対象にも無いので、その場合だけ git add を呼ばない。
          #   ★ `|| true` で握りつぶさない。権限やリポジトリ破損など、本当に
          #     対処が要る失敗まで無音になる（2026-09-10 の shirokuma-sec 指摘）。
          if [ -f pending_repair_notice.json ] \
             || git ls-files --error-unmatch pending_repair_notice.json >/dev/null 2>&1; then
            # ★ `-A` を付けて削除も明示的にステージする（2026-09-10 の Gemini Pro 指摘）。
            #   素の `git add <file>` でも削除は入るが、それは Git 2.0 で変わった
            #   既定の挙動に乗っているだけ。ここで削除が入らないと、伝え終えた
            #   お知らせがリポジトリに残り続け、次の実行が同じ内容を言い直す。
            git add -A -- pending_repair_notice.json
          fi
          # ★ push の前に必ず rebase で追いつく。
          #   bot の実行中（1〜2分）に誰かが main へ push していると、
          #   ここが non-fast-forward で失敗する。失敗すると state が保存されず、
          #   次回また同じ起点から読み直して**転記済みの契約報告を二重に投稿する**。
          #   触るのは last_processed.txt と pending_repair_notice.json の2つだけで、
          #   どちらもこのbotしか書かないので、rebase で衝突する余地はほぼ無い。
          git diff --staged --quiet || (
            git commit -m "update last processed [skip ci]" &&
            git pull --rebase origin main &&
            git push
          )
